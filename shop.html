<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalog — P2P Solutions</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div class="app-wrapper">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-body">

      <div class="page-header fade-up">
        <div>
          <h2>Supplier Catalog</h2>
          <p>Browse supplier stock and raise an order — live stock updated in real time</p>
        </div>
        <div class="page-header-actions">
          <div class="search-bar" style="width:240px">
            <span class="si">🔍</span>
            <input class="form-control" id="shopSearch" placeholder="Search products…" oninput="renderShop()"/>
          </div>
          <select class="fsel" id="shopSort" onchange="renderShop()">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="name">Name A–Z</option>
            <option value="stock">Most in stock</option>
          </select>
        </div>
      </div>

      <div class="cat-chips fade-up d1" id="catChips"></div>

      <div class="shop-grid fade-up d2" id="shopGrid"></div>

    </div>
  </div>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="pmTitle">Product</span>
      <button class="modal-close" onclick="Modal.close('productModal')">✕</button>
    </div>
    <div class="modal-body" id="pmBody"></div>
    <div class="modal-footer" id="pmFooter"></div>
  </div>
</div>

<div class="toast-container"></div>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script>
let products = [];
let activeCat = 'All';

document.addEventListener('DOMContentLoaded', () => {
  const user = initPage('shop', 'Supplier Catalog', 'Catalog');
  if (!user) return;
  if (!['procurement', 'admin'].includes(user.role)) { window.location.href = 'dashboard.html'; return; }
  products = Store.getProducts();
  renderCats();
  renderShop();
});

function renderCats() {
  const cats = ['All', ...new Set(products.map(p => p.category))];
  document.getElementById('catChips').innerHTML = cats.map(c =>
    `<div class="cat-chip ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</div>`
  ).join('');
}

function setCat(c) { activeCat = c; renderCats(); renderShop(); }

function stockClass(n) { return n === 0 ? 'out' : n <= 2 ? 'low' : 'ok'; }
function stockLabel(n) { return n === 0 ? 'Out of stock' : `${n} in stock`; }
function imgTag(p) { return p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='${p.fallback || 'assets/products/box.svg'}'"/>` : p.emoji; }

function renderShop() {
  const q = (document.getElementById('shopSearch').value || '').toLowerCase();
  const sort = document.getElementById('shopSort').value;
  const list = products.filter(p =>
    (activeCat === 'All' || p.category === activeCat) &&
    (p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q))
  );
  if (sort === 'price-asc')  list.sort((a, b) => a.price - b.price);
  if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
  if (sort === 'name')       list.sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'stock')      list.sort((a, b) => stockOf(b) - stockOf(a));
  const grid = document.getElementById('shopGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🛍️</div><h4>No products found</h4><p>Try a different category or search term.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const n = stockOf(p);
    return `
    <div class="product-card" onclick="openProduct('${p.id}')">
      <div class="product-img"><span class="brand-chip">${p.brand}</span>${imgTag(p)}</div>
      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
        <span class="stock-badge ${stockClass(n)}">${stockLabel(n)}</span>
        <div class="product-price">${Util.formatCurrency(p.price)}</div>
      </div>
    </div>`;
  }).join('');
}

function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const n = stockOf(p);
  const codes = p.units.filter(u => u.status === 'in_stock').map(u => u.code);
  document.getElementById('pmTitle').textContent = p.name;
  document.getElementById('pmBody').innerHTML = `
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="width:200px;height:150px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#F8FAFC">${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover" onerror="this.onerror=null;this.src='${p.fallback || 'assets/products/box.svg'}'"/>` : `<div style="font-size:5rem;text-align:center;line-height:150px">${p.emoji}</div>`}</div>
      <div style="flex:1;min-width:200px">
        <div class="product-brand">${p.brand} · ${p.category}</div>
        <div style="font-size:1.2rem;font-weight:700;margin:4px 0">${p.name}</div>
        <div class="product-price" style="font-size:1.6rem">${Util.formatCurrency(p.price)}</div>
        <div class="stock-badge ${stockClass(n)}" style="font-size:0.8rem;margin-top:6px">${stockLabel(n)}</div>
        <div class="form-label" style="margin-top:14px">Available material codes</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${codes.length ? codes.map(c => `<span class="unit-chip in_stock">${c}</span>`).join('') : '<span class="text-muted">None — out of stock</span>'}
        </div>
      </div>
    </div>`;
  document.getElementById('pmFooter').innerHTML = `
    <button class="btn btn-secondary" onclick="Modal.close('productModal')">Close</button>
    <label style="display:${n === 0 ? 'none' : 'flex'};align-items:center;gap:6px;font-size:0.78rem;color:var(--text-secondary)">
      Qty <input type="number" id="pmQty" value="1" min="1" max="${n}" class="form-control" style="width:72px;padding:6px 8px"/>
    </label>
    <button class="btn btn-primary" ${n === 0 ? 'disabled' : ''} onclick="raisePO('${p.id}')">🧾 Raise Purchase Order</button>`;
  Modal.open('productModal');
}

function raisePO(id) {
  const all = Store.getProducts();
  const p = all.find(x => x.id === id);
  const available = p ? p.units.filter(u => u.status === 'in_stock') : [];
  if (!available.length) { Toast.warning('Out of stock', 'This product has no available units.'); return; }

  const qtyInput = parseInt((document.getElementById('pmQty') || {}).value) || 1;
  const qty = Math.max(1, Math.min(qtyInput, available.length));
  const taken = available.slice(0, qty);
  taken.forEach(u => u.status = 'sold');
  Store.saveProducts(all);

  const codes = taken.map(u => u.code);
  const total = p.price * qty;
  const user = Store.getUser();
  const seller = P2PData.users.find(u => u.id === p.sellerId);
  const sup = P2PData.suppliers.find(s => s.userId === p.sellerId);
  const supName = sup ? sup.name : (seller ? seller.brandName : 'Supplier');
  const supId = sup ? sup.id : (seller ? seller.supplierId : null);
  const stamp = Date.now().toString().slice(-6);

  // Record the order (procurement ↔ supplier tracker)
  const orders = Store.getOrders();
  orders.unshift({
    id: 'ORD-' + stamp,
    type: 'direct', buyerId: user.id, supplierId: supId,
    productId: p.id, productName: p.name,
    code: codes.join(', '), qty, price: p.price, total,
    status: 'confirmed', date: Util.today(),
  });
  Store.saveOrders(orders);

  // Create the matching Purchase Order (procurement ↔ finance flow)
  const pos = Store.getPOs();
  pos.unshift({
    id: 'PO-' + stamp,
    type: 'direct', prId: null, supplier: supName, supId,
    buyerId: user.id, materialCode: codes.join(', '), productId: p.id,
    amount: total, status: 'confirmed', created: Util.today(),
    delivery: Util.addDays(Util.today(), 7), approvedBy: user.name, payStatus: 'pending',
  });
  Store.savePOs(pos);

  products = all;
  Modal.close('productModal');
  Toast.success('Purchase Order raised', `Direct PO for ${qty}× ${p.name} — ${Util.formatCurrency(total)} sent to ${supName}.`);
  renderShop();
}
</script>
</body>
</html>
