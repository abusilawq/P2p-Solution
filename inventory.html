<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory — P2P Solutions</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div class="app-wrapper">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-body">

      <div class="page-header fade-up">
        <div>
          <h2>Inventory</h2>
          <p>Live stock & material codes — edit your storage in real time</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="Modal.open('newProductModal')">+ New Product</button>
        </div>
      </div>

      <div class="stats-grid fade-up d1" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card"><div class="sic blue">📦</div><div class="sinfo"><div class="sval" id="statProducts">—</div><div class="slbl">Products</div></div></div>
        <div class="stat-card"><div class="sic green">✅</div><div class="sinfo"><div class="sval" id="statStock">—</div><div class="slbl">Units In Stock</div></div></div>
        <div class="stat-card"><div class="sic amber">⚠️</div><div class="sinfo"><div class="sval" id="statLow">—</div><div class="slbl">Low / Out of Stock</div></div></div>
      </div>

      <div class="inv-layout fade-up d2">
        <div class="inv-tree" id="invTree"></div>
        <div class="card" id="invDetailCard">
          <div class="card-body" id="invDetail">
            <div class="empty-state"><div class="empty-icon">📦</div><h4>Select a product</h4><p>Pick a brand from the left to view and edit its stock.</p></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- New Product Modal -->
<div class="modal-overlay" id="newProductModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Product</span>
      <button class="modal-close" onclick="Modal.close('newProductModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="productForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label req">Category</label>
            <input class="form-control" id="npCategory" placeholder="e.g. Laptops" required/>
          </div>
          <div class="form-group">
            <label class="form-label req">Brand</label>
            <input class="form-control" id="npBrand" placeholder="e.g. Asus" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label req">Product Name</label>
          <input class="form-control" id="npName" placeholder="e.g. Asus Laptop" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label req">Material Code Prefix</label>
            <input class="form-control" id="npPrefix" placeholder="e.g. AL" maxlength="4" required/>
          </div>
          <div class="form-group">
            <label class="form-label req">Unit Price (RM)</label>
            <input type="number" class="form-control" id="npPrice" min="0" step="0.01" required/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Initial Stock Units</label>
            <input type="number" class="form-control" id="npQty" min="0" value="0"/>
          </div>
          <div class="form-group">
            <label class="form-label">Icon (emoji)</label>
            <input class="form-control" id="npEmoji" value="📦"/>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('newProductModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createProduct()">Create Product</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script>
let me_, all_, mine_, selectedId = null;

document.addEventListener('DOMContentLoaded', () => {
  me_ = initPage('inventory', 'Inventory', 'Inventory');
  if (!me_) return;
  if (!['supplier', 'admin'].includes(me_.role)) { window.location.href = 'dashboard.html'; return; }
  load();
});

function load() {
  all_ = Store.getProducts();
  mine_ = me_.role === 'admin' ? all_ : all_.filter(p => p.sellerId === me_.id);
  updateStats();
  renderTree();
  if (selectedId && mine_.find(p => p.id === selectedId)) renderDetail(selectedId);
}

function updateStats() {
  const totalStock = mine_.reduce((s, p) => s + stockOf(p), 0);
  const low = mine_.filter(p => stockOf(p) <= 2).length;
  document.getElementById('statProducts').textContent = mine_.length;
  document.getElementById('statStock').textContent = totalStock;
  document.getElementById('statLow').textContent = low;
}

function renderTree() {
  const cats = [...new Set(mine_.map(p => p.category))];
  document.getElementById('invTree').innerHTML = cats.map(cat => {
    const prods = mine_.filter(p => p.category === cat);
    const open = prods.some(p => p.id === selectedId);
    return `
      <div class="inv-cat ${open ? 'open' : ''}">
        <div class="inv-cat-label" onclick="this.parentElement.classList.toggle('open')">
          <span>${cat}</span><span class="inv-caret">▶</span>
        </div>
        <div class="inv-brands">
          ${prods.map(p => `
            <div class="inv-brand ${p.id === selectedId ? 'active' : ''}" onclick="renderDetail('${p.id}')">
              <span>${p.emoji} ${p.brand}</span>
              <span class="inv-count">${stockOf(p)} pcs</span>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('') || '<div class="empty-state"><p>No products yet.</p></div>';
}

function renderDetail(id) {
  selectedId = id;
  const p = all_.find(x => x.id === id);
  if (!p) return;
  const n = stockOf(p);
  renderTree();
  document.getElementById('invDetail').innerHTML = `
    <div class="d-flex align-center justify-between mb-16" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:84px;height:64px;border-radius:8px;overflow:hidden;background:#F8FAFC;flex-shrink:0">${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover"/>` : `<div style="font-size:2.2rem;text-align:center;line-height:64px">${p.emoji}</div>`}</div>
        <div>
          <div style="font-size:1.2rem;font-weight:700">${p.name}</div>
          <div class="product-brand">${p.brand} · ${p.category}</div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="product-price">${Util.formatCurrency(p.price)}</div>
        <div class="stock-badge ${n===0?'out':n<=2?'low':'ok'}">${n===0?'Out of stock':n+' in stock'}</div>
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-sm btn-primary" onclick="addUnits('${p.id}',1)">+ Add 1 unit</button>
      <button class="btn btn-sm btn-secondary" onclick="addUnits('${p.id}',5)">+ Add 5 units</button>
      <button class="btn btn-sm btn-secondary" onclick="editPrice('${p.id}')">✏️ Edit price</button>
      <button class="btn btn-sm btn-danger" onclick="removeProduct('${p.id}')">🗑 Delete product</button>
    </div>

    <div class="form-label">Material-coded units <span class="text-muted">(click a unit to toggle sold / in-stock)</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
      ${p.units.map((u, i) => `
        <span class="unit-chip ${u.status}" style="cursor:pointer" onclick="toggleUnit('${p.id}',${i})">
          ${u.code} ${u.status==='sold'?'· sold':''}
        </span>`).join('') || '<span class="text-muted">No units yet — add stock above.</span>'}
    </div>`;
}

function addUnits(id, count) {
  const p = all_.find(x => x.id === id);
  for (let i = 0; i < count; i++) p.units.push({ code: nextMaterialCode(p), status: 'in_stock' });
  Store.saveProducts(all_);
  Toast.success('Stock added', `${count} unit(s) added to ${p.name}.`);
  load();
}

function toggleUnit(id, idx) {
  const p = all_.find(x => x.id === id);
  const u = p.units[idx];
  u.status = u.status === 'in_stock' ? 'sold' : 'in_stock';
  Store.saveProducts(all_);
  load();
}

function editPrice(id) {
  const p = all_.find(x => x.id === id);
  const v = prompt('New unit price (RM) for ' + p.name + ':', p.price);
  if (v === null) return;
  const num = parseFloat(v);
  if (isNaN(num) || num < 0) { Toast.warning('Invalid price', 'Enter a valid number.'); return; }
  p.price = num;
  Store.saveProducts(all_);
  Toast.success('Price updated', `${p.name} is now ${Util.formatCurrency(num)}.`);
  load();
}

function removeProduct(id) {
  const p = all_.find(x => x.id === id);
  if (!confirm('Delete ' + p.name + ' and all its stock?')) return;
  all_ = all_.filter(x => x.id !== id);
  Store.saveProducts(all_);
  selectedId = null;
  document.getElementById('invDetail').innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><h4>Select a product</h4></div>`;
  Toast.success('Deleted', `${p.name} removed.`);
  load();
}

function createProduct() {
  const f = id => document.getElementById(id).value.trim();
  const category = f('npCategory'), brand = f('npBrand'), name = f('npName');
  const prefix = f('npPrefix').toUpperCase(), price = parseFloat(f('npPrice'));
  const qty = parseInt(f('npQty')) || 0, emoji = f('npEmoji') || '📦';
  if (!category || !brand || !name || !prefix || isNaN(price)) { Toast.warning('Validation', 'Fill all required fields.'); return; }

  const units = [];
  for (let i = 1; i <= qty; i++) units.push({ code: prefix + ' ' + String(i).padStart(3, '0'), status: 'in_stock' });
  const prod = { id: 'P-' + Date.now().toString(36).toUpperCase(), category, brand, name, emoji, image: 'assets/products/box.svg', materialPrefix: prefix, price, sellerId: me_.id, units };
  all_.unshift(prod);
  Store.saveProducts(all_);
  Modal.close('newProductModal');
  document.getElementById('productForm').reset();
  document.getElementById('npEmoji').value = '📦';
  Toast.success('Product created', `${name} added with ${qty} unit(s).`);
  selectedId = prod.id;
  load();
}
</script>
</body>
</html>
